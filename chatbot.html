<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Recruitment Chatbot</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(-45deg, #667eea, #764ba2, #36b9cc, #1cc88a);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .chat-container {
        width: 100%;
        max-width: 900px;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .chat-window {
        max-height: 400px;
        overflow-y: auto;
        padding: 15px;
        border-radius: 12px;
        background: #f8f9fc;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .user-msg {
        align-self: flex-end;
        background: linear-gradient(45deg, #4e73df, #224abe);
        color: white;
        padding: 10px 14px;
        border-radius: 15px 15px 0 15px;
        max-width: 70%;
        font-size: 14px;
    }

    .bot-msg {
        align-self: flex-start;
        background: #e9ecef;
        color: #333;
        padding: 10px 14px;
        border-radius: 15px 15px 15px 0;
        max-width: 70%;
        font-size: 14px;
    }

    textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        resize: none;
        font-size: 14px;
        transition: 0.3s;
    }

    textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 8px rgba(102,126,234,0.4);
    }

    button {
        margin-top: 12px;
        padding: 12px;
        width: 100%;
        background: linear-gradient(45deg, #1cc88a, #17a673);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: linear-gradient(45deg, #ff6b6b, #e74a3b);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
    }

    .back-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .center {
        text-align: center;
    }

</style>
</head>

<body>

<div class="chat-container">
    <h2>🤖 AI Recruitment Chatbot</h2>

    <!-- Conversation Window -->
    <div class="chat-window">
        {% for chat in chat_history %}
            <div class="user-msg">{{ chat.user }}</div>
            <div class="bot-msg">{{ chat.bot }}</div>
        {% endfor %}
    </div>

    <!-- Input Form -->
    <form method="POST" action="/chatbot">
        <textarea name="message" rows="3"
            placeholder="Ask about jobs, skills, resume..."
            required></textarea>
        <button type="submit">Send Message</button>
    </form>

    <div class="center">
        <a href="/dashboard" class="back-btn">⬅ Back to Dashboard</a>
    </div>
</div>

</body>
</html>
